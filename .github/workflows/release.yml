# Triggered by a version tag (v1.0.0): publishes release notes and update instructions
# on GitHub Releases without producing ad-hoc prebuilt binaries (since File Provider
# extensions require local code signing with personal Apple ID for AMFI / App Groups).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish Release Notes
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ### Installing or Updating FreeMount

            Because FreeMount uses Apple File Provider extensions, App Groups, and Keychain sharing, macOS requires it to be signed by your personal Apple ID team. Prebuilt unsigned or ad-hoc binaries cannot launch the extension on other Macs.

            #### One-line Install / Update
            Run the install script in Terminal:
            ```bash
            git clone https://github.com/ChornyiDev/FreeMount.git && cd FreeMount && ./scripts/install-from-source.sh
            ```

            If you already have FreeMount installed, click **"Update Now"** in FreeMount Settings → About, or run:
            ```bash
            cd ~/FreeMount && git pull && ./scripts/install-from-source.sh
            ```
