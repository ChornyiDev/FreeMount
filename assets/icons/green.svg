<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00B24B"/>
      <stop offset="100%" stop-color="#006E2B"/>
    </linearGradient>
    <linearGradient id="cloud-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#E8F7ED"/>
      <stop offset="100%" stop-color="#C4EBD0"/>
    </linearGradient>
    <linearGradient id="fm-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#007B32"/>
      <stop offset="100%" stop-color="#004E1E"/>
    </linearGradient>
    <filter id="cloud-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00290e" flood-opacity="0.35"/>
    </filter>
    <filter id="fm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00290e" flood-opacity="0.30"/>
    </filter>
    <clipPath id="squircle-clip">
      <rect width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- Background Squircle -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg-gradient)"/>

  <!-- Content clipped to squircle -->
  <g clip-path="url(#squircle-clip)">
    <!-- Cloud Layer -->
    <path fill="url(#cloud-gradient)" filter="url(#cloud-shadow)"
          transform="matrix(1.2 0 0 1.2 -78.4 75.6)"
          d="M304 738C193.5 738 104 650.3 104 542c0-82.7 52.3-153.4 126.3-182.2C248.5 274.7 325.8 211 418 211c98.2 0 179.4 72.3 193.4 166.6A201.2 201.2 0 0 1 665 370c118.7 0 215 94.8 215 211.8C880 668.1 808.9 738 721.2 738H304Z"/>

    <!-- FM Monogram Layer -->
    <path fill="url(#fm-gradient)" filter="url(#fm-shadow)"
          transform="translate(-14 161)"
          d="M283 430c0-24.3 19.7-44 44-44h211c13.8 0 21.9 15.6 14 27l-31 40c-8.3 10.7-21.1 17-34.7 17H365v64h105c19.3 0 35 15.7 35 35s-15.7 35-35 35H365v96c0 24.3-19.7 44-44 44h-38V430Zm276 101.2c0-10.8 4-21.2 11.2-29.2l36.4-40.7c12.5-14 34.7-13.1 46 1.9l72.7 96.2 73.4-99.4c8.3-11.3 21.5-18 35.5-18H854c24.3 0 44 19.7 44 44V700c0 24.3-19.7 44-44 44h-38V576.8l-60.4 81.8c-15.8 21.3-47.7 21.5-63.7.3L641 591.5V700c0 24.3-19.7 44-44 44h-38V531.2Z"/>
  </g>
</svg>